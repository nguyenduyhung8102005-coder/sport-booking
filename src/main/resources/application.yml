spring:
  application:
    name: sport-booking
  config:
    # Đọc thêm biến từ file .env ở thư mục chạy app nếu có (chứa secret VNPay, không commit lên Git)
    import: optional:file:.env[.properties]
  profiles:
    # Không chỉ định profile -> dùng "dev" (bật DevDataSeeder). Khi deploy: SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/sport_booking
    username: ${DB_USERNAME:sport}
    password: ${DB_PASSWORD:sport123}
  jpa:
    # Không giữ kết nối DB mở tới tận controller -> buộc load đủ dữ liệu trong service
    open-in-view: false
    hibernate:
      # Flyway tạo/sửa schema; Hibernate chỉ kiểm tra entity có khớp không
      ddl-auto: validate
    properties:
      hibernate:
        # KHÔNG đặt hibernate.jdbc.time_zone: Hibernate sẽ đổi cả LocalTime/LocalDate theo múi giờ đó
        # (06:00 giờ VN bị lưu thành 23:00, ngày 09/11 có thể thành 08/11).
        # Instant <-> TIMESTAMPTZ vẫn luôn lưu đúng mốc thời gian tuyệt đối mà không cần cấu hình này.
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Chặn client xin ?size=100000 làm sập DB
        max-page-size: 100
  mvc:
    format:
      # Định dạng query param: ?date=2026-11-07&startTime=17:00
      date: iso
      time: HH:mm
  mail:
    # Dev: Mailpit trong docker-compose. Production: SMTP thật (Gmail, SendGrid...) qua biến môi trường
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    # Base64 của khóa >= 256 bit (tạo bằng: openssl rand -base64 32).
    # Giá trị mặc định CHỈ dùng khi dev. Production BẮT BUỘC truyền qua biến môi trường JWT_SECRET.
    secret: ${JWT_SECRET:MDc09+Q1ZZXRUDffNEfGOyVP/aYG2ZYzsxV2kXSLX/g=}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  admin:
    # Tài khoản admin được tạo tự động khi khởi động nếu chưa tồn tại
    email: ${ADMIN_EMAIL:admin@sportbooking.vn}
    password: ${ADMIN_PASSWORD:Admin@123456}
  booking:
    # Giờ của sân là giờ Việt Nam, dù server chạy ở múi giờ nào
    zone: Asia/Ho_Chi_Minh
    # Giữ chỗ chờ thanh toán; quá hạn thì BookingExpirationJob tự chuyển sang EXPIRED và nhả slot
    hold-duration: 10m
    # Job quét booking quá hạn mỗi 30 giây, mỗi lần tối đa 100 booking
    expiration-check-interval-ms: 30000
    expiration-batch-size: 100
    # Khách chỉ được tự hủy lượt ĐÃ THANH TOÁN nếu còn ít nhất 24 giờ trước giờ chơi
    cancel-deadline: 24h
    # Chỉ được đặt trước tối đa 30 ngày
    max-advance-days: 30
    # Mỗi lượt đặt tối đa 8 slot = 4 tiếng
    max-slots-per-booking: 8
    # Chống "giữ chỗ ảo": tối đa 3 lượt đặt chưa thanh toán cùng lúc
    max-pending-per-customer: 3
    # Job chuyển lượt đã thanh toán sang COMPLETED sau giờ chơi: chạy mỗi 5 phút
    completion-check-interval-ms: 300000
  mail:
    # Tắt thì app không gửi email (vẫn chạy bình thường)
    enabled: true
    from: "Sport Booking <no-reply@sportbooking.vn>"
  scheduling:
    # Bật/tắt các job @Scheduled (test tắt đi và gọi job trực tiếp để kết quả xác định)
    enabled: true
  vnpay:
    # Bỏ trống thì app vẫn chạy, chỉ API tạo thanh toán báo "chưa cấu hình"
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
    version: 2.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # In câu SQL ra console, hữu ích khi học. Tắt khi deploy.
    org.hibernate.SQL: debug
