# Cấu hình riêng khi chạy test (profile "test"). Datasource do Testcontainers cung cấp (@ServiceConnection).
app:
  scheduling:
    # Không để job chạy ngầm theo lịch trong lúc test: test tự gọi job khi cần -> kết quả luôn xác định
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    # Trong test đồng thời, các request thua cuộc gây lỗi "duplicate key" ở DB. Đó là hành vi MONG ĐỢI,
    # tắt log này để output test dễ đọc.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: off
