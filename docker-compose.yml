# Chế độ dev (mặc định):          docker compose up -d                       -> chỉ PostgreSQL + Mailpit, app chạy từ IntelliJ
# Chạy cả hệ thống bằng Docker:    docker compose --profile app up -d --build  -> thêm container app (build từ Dockerfile)
services:
  postgres:
    image: postgres:17-alpine
    container_name: sportbooking-db
    environment:
      POSTGRES_DB: sport_booking
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport_booking"]
      interval: 5s
      retries: 10

  # Máy chủ email GIẢ cho môi trường dev: nhận mọi email app gửi đi, KHÔNG gửi ra Internet.
  # Xem email tại http://localhost:8025. (Mailpit là bản kế nhiệm được bảo trì của MailHog.)
  mailpit:
    image: axllent/mailpit
    container_name: sportbooking-mail
    ports:
      - "1025:1025"   # SMTP: app gửi mail vào đây
      - "8025:8025"   # Giao diện web để đọc mail

  app:
    # "profiles": service này chỉ chạy khi gọi với --profile app, để không tranh cổng 8080 với app chạy từ IntelliJ
    profiles: ["app"]
    build: .
    container_name: sportbooking-app
    depends_on:
      postgres:
        condition: service_healthy   # chờ PostgreSQL sẵn sàng thật sự (healthcheck), không chỉ "đã khởi động"
      mailpit:
        condition: service_started
    # Đọc secret (VNPAY_*, JWT_SECRET...) từ .env nếu có. File .env không bị copy vào image (.dockerignore).
    env_file:
      - path: .env
        required: false
    environment:
      # Trong mạng của Compose, các container gọi nhau bằng TÊN SERVICE ("postgres"), không phải localhost:
      # localhost bên trong container app là chính container app.
      DB_URL: jdbc:postgresql://postgres:5432/sport_booking
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
