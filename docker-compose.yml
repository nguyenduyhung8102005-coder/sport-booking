services:
  postgres:
    image: postgres:17-alpine
    container_name: sportbooking-db
    environment:
      POSTGRES_DB: sport_booking
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport_booking"]
      interval: 5s
      retries: 10

  # Máy chủ email GIẢ cho môi trường dev: nhận mọi email app gửi đi, KHÔNG gửi ra Internet.
  # Xem email tại http://localhost:8025. (Mailpit là bản kế nhiệm được bảo trì của MailHog.)
  mailpit:
    image: axllent/mailpit
    container_name: sportbooking-mail
    ports:
      - "1025:1025"   # SMTP: app gửi mail vào đây
      - "8025:8025"   # Giao diện web để đọc mail

volumes:
  pgdata:
